<!DOCTYPE html>

<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Phantom Mask — a personal corner of the grotesque, the mysterious and the macabre.">

    <title>Phantom Mask</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <style>

    /* MUDAR CORES E FONTES */

    :root{
  
      --bg:        #000000;
      --dots:      #3f041b;   /* pontinhos do fundo */
      --panel:     #0b060b;
      --ink:       #9e9090;   /* texto prateado */
      --muted:     #706e6e;
      --accent:    #630c27;   /* vermelho sangue */
      --edge:      #320819;   /* bordas em relevo */
      --link:      #9a0048;
      --visited:   #910153;
      --title:     "UnifrakturCook","Old English Text MT","Times New Roman",serif;
      --body:      Verdana,Tahoma,Geneva,sans-serif;
      --mono:      "Courier New",Courier,monospace;
      --page-width: 48rem;
      color-scheme: dark;
}

/* BASE */

*,*::before,*::after{ box-sizing:border-box; }

html{ height:100%; }

body{
  margin:0;
  min-height:100%;
  padding:1rem .5rem;
  padding-top:calc(1rem + env(safe-area-inset-top, 0px));
  padding-bottom:calc(1rem + env(safe-area-inset-bottom, 0px));
  background:var(--bg) radial-gradient(circle, var(--dots) 1px, transparent 1.6px) 0 0 / 22px 22px;
  color:var(--ink);
  font:13px/1.6 var(--body);
}

a{ color:var(--link); }
a:visited{ color:var(--visited); }
a:hover{ color:#fff; background:var(--accent); }
a:focus-visible{ outline:2px dotted #fff; outline-offset:2px; }

/* LAYOUT */

.page{
  max-width:var(--page-width);
  margin:0 auto;
  background:var(--panel);
  border:5px ridge var(--edge);
}

.banner{
  text-align:center;
  padding:1.2rem .8rem .8rem;
  border-bottom:3px double var(--edge);
}
.banner h1{
  font-family:var(--title);
  font-weight:700;
  font-size:clamp(2.6rem, 12vw, 4.6rem);
  line-height:1.05;
  margin:0;
  color:var(--accent);
  text-shadow:3px 3px 0 #3a0008, 5px 5px 0 #000;
}
.banner p{
  font-family:"Times New Roman",Times,serif;
  font-style:italic;
  font-size:1.15rem;
  margin:.4rem 0 0;
  color:var(--muted);
}

.cols{
  display:grid;
  grid-template-columns:11.5rem 1fr;
}
aside{
  padding:.8rem;
  border-right:3px double var(--edge);
  background:#070707;
}
main{
  padding:1rem 1.2rem 1.5rem;
  min-width:0;   /* impede o grid de estourar */
}

/* FAIXA ROLANTE */

.marquee{
  overflow:hidden;
  white-space:nowrap;
  background:#1a0509;
  border-bottom:2px solid var(--edge);
  color:var(--accent);
  font-family:var(--mono);
  font-weight:bold;
  padding:.25rem 0;
}
.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:scroll 18s linear infinite;
}
@keyframes scroll{ to{ transform:translateX(-100%); } }

.blink{ animation:blink 1s steps(1) infinite; color:#ffeb3b; font-weight:bold; }
@keyframes blink{ 50%{ visibility:hidden; } }

@media (prefers-reduced-motion: reduce){
  .marquee{ white-space:normal; }
  .marquee span{ animation:none; padding-left:.6rem; white-space:normal; }
  .blink{ animation:none; }
}

/* COMPONENTES DA BARRA LATERAL */

.btn{
  display:block;
  text-align:center;
  margin:0 0 .4rem;
  padding:.3rem;
  background:#222;
  color:#ddd !important;
  text-decoration:none;
  border:2px outset #777;
  font-weight:bold;
}
.btn:hover{ background:var(--accent); }
.btn:active{ border-style:inset; }
.btn.is-active{ background:var(--accent); color:#fff !important; border-style:inset; }

.box{
  margin:1rem 0;
  padding:.5rem;
  border:2px inset #444;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}
.counter{
  font-family:var(--mono);
  font-weight:bold;
  font-size:1.2rem;
  letter-spacing:1px;
}
.counter i{
  font-style:normal;
  display:inline-block;
  background:#000;
  color:#ff3b3b;
  border:1px inset #555;
  padding:0 3px;
  margin:0 1px;
}

/* CONTEUDO DO SITE!!!!! */

h2{
  font-family:var(--title);
  font-weight:700;
  font-size:1.9rem;
  color:var(--accent);
  margin:0 0 .5rem;
  text-shadow:2px 2px 0 #3a0008;
}
hr{ border:0; border-top:3px ridge var(--edge); margin:1.4rem 0; }

.post-item{ margin:0 0 1.1rem; }
.post-item h3{ font-size:1.1rem; margin:0; }
.post-item p{ margin:.2rem 0; }

.date{
  font-family:var(--mono);
  color:var(--muted);
  font-size:12px;
}
.date a{ text-decoration:none; }

article h1{
  font-family:var(--title);
  font-weight:700;
  font-size:2.3rem;
  line-height:1.1;
  color:var(--accent);
  margin:0 0 .4rem;
  text-shadow:2px 2px 0 #3a0008;
}
article .body{
  margin-top:1rem;
  font-size:14px;
  line-height:1.75;
}
.about p{ margin:0 0 .8rem; }

.post-nav{
  display:flex;
  justify-content:space-between;
  gap:1rem;
  font-family:var(--mono);
  font-size:12px;
}
.post-nav a{ flex:1; text-decoration:none; }
.post-nav a:last-child{ text-align:right; }

.empty{ color:var(--muted); font-style:italic; }
.more{ font-family:var(--mono); font-size:12px; }

/* RODAPÉ */

footer{
  padding:.8rem;
  border-top:3px double var(--edge);
  text-align:center;
  font-size:11px;
  color:var(--muted);
}
footer a{ margin:0 .3rem; }

/*  RESPONSIVO */

@media (max-width: 40rem){
  .cols{ grid-template-columns:1fr; }
  aside{ border-right:0; border-bottom:3px double var(--edge); }
}
</style>
</head>

<body>

<div class="page">
  <header class="banner">
    <h1 id="siteName"></h1>
    <p id="tagline"></p>
  </header>

  <div class="marquee"><span id="marqueeText"></span></div>

  <div class="cols">
    <aside id="sidebar"></aside>
    <main id="app"></main>
  </div>

  <footer id="footer"></footer>
</div>


<!-- CONFIGURAÇÕES DO SITE: nome, frase, faixa rolante, contador, links. -->

<!-- POSTS: copiar um bloco inteiro, colar no TOPO da lista e mudar os campos:
       slug  -> é o endereço do post
       date  -> AAAA-MM-DD
       tags  -> opcional
       body  -> cada texto vira um parágrafo-->

<!-- MOTOR DO SITE   -->

<script>
/* ---------- 3.1 utilitários ---------- */
const $ = (sel, root = document) => root.querySelector(sel);

const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ESCAPES[ch]);

/** "2026-10-01" -> "01/10/2026"  (troque a ordem aqui se preferir MM/DD/AAAA) */
const fmtDate = iso => {
  const [y, m, d] = String(iso).split("-");
  return (y && m && d) ? `${d}/${m}/${y}` : String(iso);
};

/** "Candlelight and Code" -> "candlelight-and-code" */
const slugify = text => String(text)
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, "-")
  .replace(/^-+|-+$/g, "");


/* ---------- 3.2 dados derivados ---------- */
const POSTS_SORTED = Array.isArray(POSTS)
  ? [...POSTS].sort((a, b) => String(b.date).localeCompare(String(a.date)))
  : [];

const LAST_UPDATE = POSTS_SORTED.length ? POSTS_SORTED[0].date : null;

const findPost = slug => POSTS_SORTED.find(p => p.slug === slug) || null;

const postsWithTag = tagSlug =>
  POSTS_SORTED.filter(p => (p.tags || []).some(t => slugify(t) === tagSlug));

const tagLabel = tagSlug => {
  for (const post of POSTS_SORTED) {
    const match = (post.tags || []).find(t => slugify(t) === tagSlug);
    if (match) return match;
  }
  return tagSlug;
};


/* ---------- 3.3 páginas ---------- */
function tagLinks(tags) {
  if (!tags || !tags.length) return "";
  return " | " + tags
    .map(t => `<a href="#/tag/${encodeURIComponent(slugify(t))}">${esc(t)}</a>`)
    .join(", ");
}

function postCard(post, isNew = false) {
  const url = `#/post/${encodeURIComponent(post.slug)}`;
  return `
    <div class="post-item">
      <h3>&raquo; <a href="${url}">${esc(post.title)}</a>${isNew ? ' <span class="blink">NEW!</span>' : ""}</h3>
      <span class="date">${fmtDate(post.date)}${tagLinks(post.tags)}</span>
      <p>${esc(post.excerpt)} <a href="${url}">[read more]</a></p>
    </div>`;
}

const views = {

  home() {
    const latest = POSTS_SORTED.slice(0, 5);
    return {
      title: SITE.name,
      content: `
        <section>
          <h2>Latest Posts</h2>
          ${latest.length
            ? latest.map((p, i) => postCard(p, i === 0)).join("")
            : `<p class="empty">The shelves are still empty — write your first post in the POSTS list.</p>`}
          ${POSTS_SORTED.length > latest.length
            ? `<p class="more"><a href="#/posts">&raquo; see all ${POSTS_SORTED.length} posts</a></p>`
            : ""}
        </section>
        <hr>
        <section class="about">
          <h2>About Me</h2>
          ${SITE.about.map(p => `<p>${esc(p)}</p>`).join("")}
        </section>`
    };
  },

  posts() {
    return {
      title: `Posts | ${SITE.name}`,
      content: `
        <section>
          <h2>All Posts</h2>
          ${POSTS_SORTED.length
            ? POSTS_SORTED.map(p => postCard(p)).join("")
            : `<p class="empty">No posts yet.</p>`}
        </section>`
    };
  },

  about() {
    return {
      title: `About | ${SITE.name}`,
      content: `
        <section class="about">
          <h2>About Me</h2>
          ${SITE.about.map(p => `<p>${esc(p)}</p>`).join("")}
          <hr>
          <p>${SITE.links.map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join(" &middot; ")}</p>
        </section>`
    };
  },

  post(slug) {
    const post = findPost(slug);
    if (!post) return views.notFound();

    const index = POSTS_SORTED.indexOf(post);
    const newer = POSTS_SORTED[index - 1];   // mais recente que este
    const older = POSTS_SORTED[index + 1];   // mais antigo que este

    return {
      title: `${post.title} | ${SITE.name}`,
      content: `
        <article>
          <h1>${esc(post.title)}</h1>
          <span class="date">${esc(SITE.author)} | ${fmtDate(post.date)}${tagLinks(post.tags)}</span>
          <div class="body">${post.body.map(p => `<p>${esc(p)}</p>`).join("")}</div>
          <hr>
          <nav class="post-nav">
            ${older ? `<a href="#/post/${encodeURIComponent(older.slug)}">&laquo; ${esc(older.title)}</a>` : "<span></span>"}
            ${newer ? `<a href="#/post/${encodeURIComponent(newer.slug)}">${esc(newer.title)} &raquo;</a>` : "<span></span>"}
          </nav>
          <p class="more"><a href="#/">&laquo; back to the main page</a></p>
        </article>`
    };
  },

  tag(slug) {
    const matches = postsWithTag(slug);
    const label = tagLabel(slug);
    return {
      title: `#${label} | ${SITE.name}`,
      content: `
        <section>
          <h2>Tag: ${esc(label)}</h2>
          ${matches.length
            ? matches.map(p => postCard(p)).join("")
            : `<p class="empty">Nothing filed under this tag.</p>`}
          <p class="more"><a href="#/posts">&laquo; all posts</a></p>
        </section>`
    };
  },

  notFound() {
    return {
      title: `404 | ${SITE.name}`,
      content: `
        <article>
          <h1>404</h1>
          <p>That page has vanished into the dark.</p>
          <p class="more"><a href="#/">&laquo; back to the main page</a></p>
        </article>`
    };
  }
};


/* ---------- 3.4 rotas ---------- */
const app = $("#app");

function currentRoute() {
  const raw = location.hash.replace(/^#\/?/, "");   // tira o "#/"
  const [segment, ...rest] = raw.split("/");
  return {
    segment: segment || "home",
    param: decodeURIComponent(rest.join("/"))
  };
}

function markActiveLink(segment) {
  document.querySelectorAll("#sidebar .btn").forEach(link => {
    const href = link.getAttribute("href") || "";
    if (!href.startsWith("#/")) return;             // ignora links externos
    const target = href.replace(/^#\/?/, "").split("/")[0] || "home";
    link.classList.toggle("is-active", target === segment);
  });
}

function render() {
  const { segment, param } = currentRoute();

  let view;
  switch (segment) {
    case "home":  view = views.home();       break;
    case "posts": view = views.posts();      break;
    case "about": view = views.about();      break;
    case "post":  view = views.post(param);  break;
    case "tag":   view = views.tag(param);   break;
    default:      view = views.notFound();
  }

  document.title = view.title;
  app.innerHTML = view.content;
  markActiveLink(segment);
  window.scrollTo(0, 0);
}


/* ---------- 3.5 partes fixas ---------- */
function buildChrome() {
  $("#siteName").textContent = SITE.name;
  $("#tagline").textContent = SITE.tagline;
  $("#marqueeText").textContent = SITE.marquee;

  const digits = String(SITE.visitors)
    .padStart(6, "0")
    .split("")
    .map(d => `<i>${d}</i>`)
    .join("");

  $("#sidebar").innerHTML = `
    <nav>
      <a class="btn" href="#/">Home</a>
      <a class="btn" href="#/posts">Posts</a>
      <a class="btn" href="#/about">About</a>
      ${SITE.links.map(l => `<a class="btn" href="${esc(l.url)}">${esc(l.label)}</a>`).join("")}
    </nav>
    <div class="box">You are visitor number<br><span class="counter">${digits}</span></div>
    ${LAST_UPDATE ? `<div class="box">Last updated<br>${fmtDate(LAST_UPDATE)}</div>` : ""}
    <div class="box">Best viewed at 800x600</div>`;

  $("#footer").innerHTML =
    `${SITE.links.map(l => `[ <a href="${esc(l.url)}">${esc(l.label)}</a> ]`).join(" ")}
     <br>&copy; ${new Date().getFullYear()} ${esc(SITE.author)} &mdash; all rights reserved`;
}


/* ---------- 3.6 inicialização ---------- */
buildChrome();
window.addEventListener("hashchange", render);
render();
</script>

</body>
</html>
