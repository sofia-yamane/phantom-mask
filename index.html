<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Phantom Mask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
  /* ============ THEME: change colors and fonts here ============ */
  :root {
    --bg: #0e020e;
    --dots: #5a0716;         /* tiled background dots */
    --panel: #11000c;
    --ink: #9e9090;          /* silver text */
    --muted: #706e6e;
    --accent: #6f0c1b;       /* blood red */
    --edge: #32080e;         /* beveled borders */
    --link: #ff4d4d;
    --visited: #b98ad0;
    --title: "UnifrakturCook", "Old English Text MT", "Times New Roman", serif;
    --body: Verdana, Tahoma, Geneva, sans-serif;
    --mono: "Courier New", Courier, monospace;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; padding: 1rem .5rem;
    background: var(--bg) radial-gradient(circle, var(--dots) 1px, transparent 1.6px) 0 0 / 22px 22px;
    color: var(--ink); font: 13px/1.6 var(--body);
  }
  a { color: var(--link); }
  a:visited { color: var(--visited); }
  a:hover { color: #fff; background: var(--accent); }
  a:focus-visible { outline: 2px dotted #fff; outline-offset: 2px; }

  .page { max-width: 48rem; margin: 0 auto; background: var(--panel); border: 5px ridge var(--edge); }
  .banner { text-align: center; padding: 1.2rem .8rem .8rem; border-bottom: 3px double var(--edge); }
  .banner h1 { font-family: var(--title); font-weight: 700; font-size: clamp(2.6rem, 12vw, 4.6rem); line-height: 1.05; margin: 0; color: var(--accent); text-shadow: 3px 3px 0 #3a0008, 5px 5px 0 #000; }
  .banner p { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 1.15rem; margin: .4rem 0 0; color: var(--muted); }

  .marquee { overflow: hidden; white-space: nowrap; background: #1a0509; border-bottom: 2px solid var(--edge); color: var(--accent); font-family: var(--mono); font-weight: bold; padding: .25rem 0; }
  .marquee span { display: inline-block; padding-left: 100%; animation: scroll 18s linear infinite; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  .blink { animation: blink 1s steps(1) infinite; color: #ffeb3b; font-weight: bold; }
  @keyframes blink { 50% { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .marquee span { animation: none; padding-left: .6rem; white-space: normal; }
    .marquee { white-space: normal; }
    .blink { animation: none; }
  }

  .cols { display: grid; grid-template-columns: 11.5rem 1fr; }
  aside { padding: .8rem; border-right: 3px double var(--edge); background: #070707; }
  main { padding: 1rem 1.2rem 1.5rem; min-width: 0; }

  .btn { display: block; text-align: center; margin: 0 0 .4rem; padding: .3rem; background: #222; color: #ddd !important; text-decoration: none; border: 2px outset #777; font-weight: bold; }
  .btn:hover { background: var(--accent); }
  .btn:active { border-style: inset; }
  .box { margin: 1rem 0; padding: .5rem; border: 2px inset #444; text-align: center; font-size: 11px; color: var(--muted); }
  .counter { font-family: var(--mono); font-weight: bold; font-size: 1.2rem; letter-spacing: 1px; }
  .counter i { font-style: normal; display: inline-block; background: #000; color: #ff3b3b; border: 1px inset #555; padding: 0 3px; margin: 0 1px; }

  h2 { font-family: var(--title); font-weight: 700; font-size: 1.9rem; color: var(--accent); margin: 0 0 .5rem; text-shadow: 2px 2px 0 #3a0008; }
  hr { border: 0; border-top: 3px ridge var(--edge); margin: 1.4rem 0; }
  .post-item { margin: 0 0 1.1rem; }
  .post-item h3 { font-size: 1.1rem; margin: 0; }
  .date { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .post-item p { margin: .2rem 0; }

  article h1 { font-family: var(--title); font-weight: 700; font-size: 2.3rem; line-height: 1.1; color: var(--accent); margin: 0 0 .4rem; text-shadow: 2px 2px 0 #3a0008; }
  article .body { margin-top: 1rem; font-size: 14px; line-height: 1.75; }
  .about p { margin: 0 0 .8rem; }

  footer { padding: .8rem; border-top: 3px double var(--edge); text-align: center; font-size: 11px; color: var(--muted); }
  footer a { margin: 0 .3rem; }

  @media (max-width: 40rem) {
    .cols { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 3px double var(--edge); }
  }
</style>
</head>
<body>

<div class="page">
  <div class="banner">
    <h1 id="siteName"></h1>
    <p id="tagline"></p>
  </div>
  <div class="marquee"><span id="marquee"></span></div>
  <div class="cols">
    <aside id="side"></aside>
    <main id="app"></main>
  </div>
  <footer id="footer"></footer>
</div>

<script>
/* ==================================================================
   EDIT THIS BLOCK. Everything on the page comes from here.
   ================================================================== */
const SITE = {
  name: "Phantom Mask",
  tagline: "~ welcome to a piece of my mind~",
  marquee: "*** Hello, wanderer! *** New posts whenever the moon allows *** God's got a sick sense of humor *** ",
  visitors: 666,                // the counter is a number you set by hand
  author: "Yamane",
  about: [
    "Hello, and welcome to my page. I am a intimate lover of the grotesque, the mysterious and the macabre.",
    "For the entireity of my existence, I have been drawn in by cinema, music, literature and social studies. I now am just starting in the tech world and I'm still trying to find my place in it.",
    "My writing here is a reflection of my thoughts, interests and experiences."
  ],
  links: [                       // shown in the sidebar and footer; add or remove freely
    { label: "Email",     url: "mailto:you@example.com" },
    { label: "GitHub",    url: "https://github.com/" },
    { label: "Guestbook", url: "mailto:you@example.com?subject=Guestbook" }
  ]
};

/* Add a new post by copying one block and putting it at the TOP.
   "slug" must be unique and URL-friendly (no spaces).
   Each string in "body" becomes a paragraph. */
const POSTS = [
  {
    slug: "the-curtain-rises",
    title: "The curtain rises",
    date: "2026-10-01",
    tags: ["intro"],
    excerpt: "Why this house of shadows exists, and what waits inside.",
    body: [
      "This is the first post. Replace these words with your own.",
      "To write a new one, open the file, find the POSTS list near the top of the script and copy a block. Change the title, date and body, and it appears on the home page by itself.",
      "That is all the ritual there is."
    ]
  },
  {
    slug: "candlelight-and-code",
    title: "Candlelight and code",
    date: "2026-09-20",
    tags: ["projects", "notes"],
    excerpt: "A second sample entry, to show how the list grows.",
    body: [
      "Use posts like this for projects, poems, confessions or anything else you wish to keep.",
      "Tags are optional. Delete the tags line from any post if you prefer."
    ]
  }
];
/* ================== end of editable block ================== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => d.slice(5, 7) + "/" + d.slice(8, 10) + "/" + d.slice(0, 4);
const app = document.getElementById("app");

function home() {
  document.title = SITE.name;
  app.innerHTML = `
    <section id="posts">
      <h2>Latest Posts</h2>
      ${POSTS.map((p, i) => `
        <div class="post-item">
          <h3>&raquo; <a href="#/post/${esc(p.slug)}">${esc(p.title)}</a> ${i === 0 ? '<span class="blink">NEW!</span>' : ""}</h3>
          <span class="date">${fmt(p.date)}${p.tags && p.tags.length ? " | " + p.tags.map(esc).join(", ") : ""}</span>
          <p>${esc(p.excerpt)} <a href="#/post/${esc(p.slug)}">[read more]</a></p>
        </div>`).join("")}
    </section>
    <hr>
    <section id="about" class="about">
      <h2>About Me</h2>
      ${SITE.about.map(t => `<p>${esc(t)}</p>`).join("")}
    </section>`;
}

function post(slug) {
  const p = POSTS.find(x => x.slug === slug);
  if (!p) {
    app.innerHTML = `<article><h1>404</h1><p>That page has vanished into the dark.</p><a href="#/">&laquo; back to the main page</a></article>`;
    return;
  }
  document.title = `${p.title} | ${SITE.name}`;
  app.innerHTML = `
    <article>
      <h1>${esc(p.title)}</h1>
      <span class="date">${esc(SITE.author)} | ${fmt(p.date)}${p.tags && p.tags.length ? " | " + p.tags.map(esc).join(", ") : ""}</span>
      <div class="body">${p.body.map(t => `<p>${esc(t)}</p>`).join("")}</div>
      <hr>
      <a href="#/">&laquo; back to the main page</a>
    </article>`;
}

function route() {
  const h = location.hash;
  if (h.startsWith("#/post/")) { post(decodeURIComponent(h.slice(7))); window.scrollTo(0, 0); }
  else {
    home();
    const t = (h === "#about" || h === "#posts") ? document.querySelector(h) : null;
    if (t) t.scrollIntoView(); else window.scrollTo(0, 0);
  }
}

/* Static page parts */
document.getElementById("siteName").textContent = SITE.name;
document.getElementById("tagline").textContent = SITE.tagline;
document.getElementById("marquee").textContent = SITE.marquee;
const digits = String(SITE.visitors).padStart(6, "0").split("").map(d => `<i>${d}</i>`).join("");
document.getElementById("side").innerHTML = `
  <a class="btn" href="#/">Home</a>
  <a class="btn" href="#posts">Posts</a>
  <a class="btn" href="#about">About</a>
  ${SITE.links.map(l => `<a class="btn" href="${esc(l.url)}">${esc(l.label)}</a>`).join("")}
  <div class="box">You are visitor number<br><span class="counter">${digits}</span></div>
  <div class="box">Last updated<br>${fmt(POSTS[0].date)}</div>
  <div class="box">Best viewed at 800x600</div>`;
document.getElementById("footer").innerHTML =
  `${SITE.links.map(l => `[ <a href="${esc(l.url)}">${esc(l.label)}</a> ]`).join(" ")}<br>&copy; ${new Date().getFullYear()} ${esc(SITE.author)} - all rights reserved`;

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
